<!DOCTYPE html>
<html lang="th">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ระบบสแกน QR Code เก็บประวัติและดาวน์โหลด</title>
    <link href="https://fonts.googleapis.com/css2?family=Sarabun:wght@300;400;600;700&display=swap" rel="stylesheet">
    <!-- ไลบรารีสำหรับประมวลผลกล้อง -->
    <!--<script src="https://unpkg.com/html5-qrcode" type="text/javascript"></script>-->
    <!-- 🔄 เปลี่ยนจาก CDN เดิมมาเรียกใช้งานไฟล์ในเซิร์ฟเวอร์ตัวเองตรงนี้ -->
    <!--<script src="html5-qrcode.min.js" type="text/javascript"></script>-->
    <script src="code.min.js" type="text/javascript"></script>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Sarabun', sans-serif;
        }

        body {
            background-color: #f1f5f9;
            display: flex;
            justify-content: center;
            align-items: flex-start;
            min-height: 100vh;
            padding: 2rem 1rem;
        }

        .scanner-card {
            background: #ffffff;
            border-radius: 16px;
            padding: 2rem;
            width: 100%;
            max-width: 500px;
            box-shadow: 0 10px 15px -3px rgba(0, 0, 0, 0.05), 0 4px 6px -4px rgba(0, 0, 0, 0.05);
            text-align: center;
        }

        h1 {
            font-size: 1.5rem;
            color: #0f172a;
            margin-bottom: 0.5rem;
        }

        p.subtext {
            color: #64748b;
            font-size: 0.9rem;
            margin-bottom: 1.5rem;
        }

        .scanner-wrapper {
            position: relative;
            width: 100%;
            border-radius: 12px;
            overflow: hidden;
            margin-bottom: 1.5rem;
            background: #000000;
            box-shadow: inset 0 2px 4px 0 rgba(0, 0, 0, 0.06);
        }

        #reader {
            width: 100%;
            min-height: 280px;
            border: none !important;
        }

        .scan-overlay {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
            display: none;
            justify-content: center;
            align-items: center;
            z-index: 10;
        }

        .focus-box {
            position: relative;
            width: 250px;
            height: 250px;
            border: 2px solid rgba(255, 255, 255, 0.3);
            border-radius: 8px;
            box-shadow: 0 0 0 4000px rgba(0, 0, 0, 0.5);
        }

        .focus-box::before,
        .focus-box::after,
        .focus-corner-bottom::before,
        .focus-corner-bottom::after {
            content: "";
            position: absolute;
            width: 24px;
            height: 24px;
            border-color: #10b981;
            border-style: solid;
            pointer-events: none;
        }

        .focus-box::before {
            top: -2px;
            left: -2px;
            border-width: 4px 0 0 4px;
            border-top-left-radius: 8px;
        }

        .focus-box::after {
            top: -2px;
            right: -2px;
            border-width: 4px 4px 0 0;
            border-top-right-radius: 8px;
        }

        .focus-corner-bottom {
            position: absolute;
            bottom: 0;
            left: 0;
            width: 100%;
            height: 100%;
        }

        .focus-corner-bottom::before {
            bottom: -2px;
            left: -2px;
            border-width: 0 0 4px 4px;
            border-bottom-left-radius: 8px;
        }

        .focus-corner-bottom::after {
            bottom: -2px;
            right: -2px;
            border-width: 0 4px 4px 0;
            border-bottom-right-radius: 8px;
        }

        .scan-laser {
            position: absolute;
            left: 5%;
            width: 90%;
            height: 3px;
            background: linear-gradient(to right, transparent, #ef4444, transparent);
            box-shadow: 0 0 8px #ef4444;
            animation: laserScan 2s linear infinite;
        }

        @keyframes laserScan {
            0% {
                top: 5%;
            }

            50% {
                top: 95%;
            }

            100% {
                top: 5%;
            }
        }

        .result-container {
            background: #f8fafc;
            border: 1px solid #e2e8f0;
            border-radius: 8px;
            padding: 1.25rem;
            text-align: left;
            word-break: break-all;
            margin-bottom: 1rem;
        }

        .result-row {
            margin-bottom: 0.75rem;
        }

        .result-row:last-child {
            margin-bottom: 0;
        }

        .result-title {
            font-weight: 700;
            color: #475569;
            font-size: 0.85rem;
            text-transform: uppercase;
        }

        .result-value {
            font-size: 1rem;
            margin-top: 0.15rem;
        }

        .text-full {
            color: #0f172a;
            font-weight: 500;
        }

        .text-extracted {
            color: #10b981;
            font-weight: 700;
            font-size: 1.1rem;
        }

        .history-container {
            margin-top: 1rem;
            border: 1px solid #cbd5e1;
            border-radius: 8px;
            background: #ffffff;
            text-align: left;
            overflow: hidden;
        }

        .history-header {
            background: #f1f5f9;
            padding: 0.75rem 1rem;
            font-weight: 600;
            color: #334155;
            border-bottom: 1px solid #cbd5e1;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .history-list {
            max-height: 200px;
            overflow-y: auto;
            padding: 1rem;
            list-style-type: decimal;
            margin-left: 1rem;
        }

        .history-list li {
            margin-bottom: 0.5rem;
            color: #0f172a;
            font-family: monospace;
            font-size: 1.05rem;
        }

        .btn-group {
            display: flex;
            gap: 0.5rem;
            justify-content: center;
            margin-bottom: 1.5rem;
        }

        .btn {
            padding: 10px 20px;
            border-radius: 6px;
            font-size: 1rem;
            border: none;
            cursor: pointer;
            font-weight: 600;
            transition: 0.2s;
        }

        .btn-primary {
            background-color: #2563eb;
            color: white;
        }

        .btn-primary:hover {
            background-color: #1d4ed8;
        }

        .btn-download {
            background-color: #10b981;
            color: white;
            font-size: 0.85rem;
            padding: 6px 12px;
        }

        .btn-download:hover {
            background-color: #059669;
        }
    </style>
</head>

<body>

    <div class="scanner-card">
        <h1>📷 สแกน QR และดึงข้อมูล</h1>
        <p class="subtext">สแกนเพื่อตัดข้อความ (ตำแหน่ง 9-30) และสะสมเป็นรายการ</p>

        <div class="btn-group">
            <button class="btn btn-primary" id="start-btn" onclick="startScanner()">🔔 เปิดกล้องสแกน</button>
        </div>

        <div class="scanner-wrapper">
            <div id="reader"></div>
            <div class="scan-overlay" id="overlay">
                <div class="focus-box">
                    <div class="scan-laser"></div>
                    <div class="focus-corner-bottom"></div>
                </div>
            </div>
        </div>

        <div class="result-container">
            <div class="result-row">
                <div class="result-title">📡 ข้อความทั้งหมด (Full Text):</div>
                <div class="result-value text-full" id="result-all">-</div>
            </div>
            <div class="result-row" style="border-top: 1px solid #cbd5e1; padding-top: 0.5rem;">
                <div class="result-title">✂️ ข้อความที่ตัดมา (ตำแหน่ง 9-30):</div>
                <div class="result-value text-extracted" id="result-split">-</div>
            </div>
        </div>

        <div class="history-container">
            <div class="history-header">
                <span>📋 รายการที่ตัดได้ (History)</span>
                <button class="btn btn-download" onclick="downloadHistory()">📥 ดาวน์โหลด .txt</button>
            </div>
            <ul class="history-list" id="history-ul">
            </ul>
        </div>
    </div>

    <!-- เรียกใช้ไฟล์ JavaScript ภายนอก -->
    <script src="script.js"></script>
    <!--<script src="html5-qrcode.min.js"></script>-->
    <script src="code.js"></script>

</body>

</html>
